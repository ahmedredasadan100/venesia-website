name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Lint · Typecheck · Verify · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify migrations present
        run: npm run verify:migrations

      - name: Verify legacy media admin closed
        run: npm run verify:legacy-media-admin

      - name: Verify Media coordination SQL contracts
        run: |
          npm run verify:media-coordination-rpc-acl
          npm run verify:media-coordination-sql

      - name: Verify Media library and delete Saga
        run: |
          npm run verify:production-media-storage
          npm run verify:media-library-system
          npm run verify:media-delete-saga

      - name: Verify Media write adoption and QA guards
        run: |
          npm run verify:media-write-adoption
          npm run verify:media-live-qa-guards

      - name: Verify Unified Content Engine
        run: npm run verify:unified-content

      - name: Verify audit coverage
        run: npm run verify:audit-coverage

      - name: Verify Admin Runtime
        run: npm run verify:admin-runtime

      - name: Verify Dashboard Truth closure
        run: npm run verify:dashboard-truth

      - name: Production build
        run: npm run build

  media-coordination-postgres:
    name: Media Coordination · PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: venesia_media_coordination_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_media_coordination_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      MEDIA_COORDINATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_media_coordination_ci
      MEDIA_COORDINATION_DATABASE_REQUIRED: "1"
      MEDIA_COORDINATION_DATABASE_DISPOSABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify Media coordination SQL contracts
        run: |
          npm run verify:media-coordination-rpc-acl
          npm run verify:media-coordination-sql

      - name: Verify Media coordination on isolated PostgreSQL 15
        run: npm run verify:media-coordination-postgres

  dashboard-truth-postgres:
    name: Dashboard Truth · PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: venesia_dashboard_truth_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_dashboard_truth_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DASHBOARD_TRUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_dashboard_truth_ci
      DASHBOARD_TRUTH_DATABASE_REQUIRED: "1"
      DASHBOARD_TRUTH_DATABASE_DISPOSABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Dashboard Truth on isolated PostgreSQL 15
        run: npm run verify:dashboard-truth-postgres
