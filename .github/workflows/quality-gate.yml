name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Lint · Typecheck · Verify · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical PR-safe Quality Gate
        run: npm run ci:check

  media-coordination-postgres:
    name: Media Coordination · PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: venesia_media_coordination_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_media_coordination_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      MEDIA_COORDINATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_media_coordination_ci
      MEDIA_COORDINATION_DATABASE_REQUIRED: "1"
      MEDIA_COORDINATION_DATABASE_DISPOSABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify Media coordination SQL contracts
        run: |
          npm run verify:media-coordination-rpc-acl
          npm run verify:media-coordination-sql

      - name: Verify Media coordination on isolated PostgreSQL 17
        run: npm run verify:media-coordination-postgres

  topics-bulk-publish-postgres:
    name: Topics Bulk Publish · PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: venesia_topics_bulk_publish_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_topics_bulk_publish_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      TOPICS_BULK_PUBLISH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_topics_bulk_publish_ci
      TOPICS_BULK_PUBLISH_DATABASE_REQUIRED: "1"
      TOPICS_BULK_PUBLISH_DATABASE_DISPOSABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify Topics bulk publish on isolated PostgreSQL 17
        run: npm run verify:topics-bulk-publish-postgres17

      - name: Generate the disposable schema TypeScript contract
        run: >-
          supabase gen types typescript
          --db-url "$TOPICS_BULK_PUBLISH_DATABASE_URL"
          --schema public
          > "$RUNNER_TEMP/topics-bulk-publish.database.types.ts"

      - name: Verify generated RPC type provenance
        env:
          TOPICS_BULK_PUBLISH_GENERATED_TYPES_PATH: ${{ runner.temp }}/topics-bulk-publish.database.types.ts
        run: npm run verify:topics-bulk-publish-generated-types

  taxonomy-consistency-postgres:
    name: Taxonomy Consistency · PostgreSQL 17 · PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: venesia_taxonomy_consistency_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_taxonomy_consistency_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

      postgrest:
        image: postgrest/postgrest:v16.2
        env:
          PGRST_DB_URI: postgresql://postgres:postgres@postgres:5432/venesia_taxonomy_consistency_ci
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: taxonomy-consistency-postgrest-jwt-secret-ci-only-20260908
          PGRST_SERVER_PORT: 3000
        ports:
          - 3001:3000

    env:
      TAXONOMY_CONSISTENCY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_taxonomy_consistency_ci
      TAXONOMY_CONSISTENCY_DATABASE_REQUIRED: "1"
      TAXONOMY_CONSISTENCY_DATABASE_DISPOSABLE: "1"
      TAXONOMY_CONSISTENCY_POSTGREST_URL: http://127.0.0.1:3001
      TAXONOMY_CONSISTENCY_POSTGREST_JWT_SECRET: taxonomy-consistency-postgrest-jwt-secret-ci-only-20260908

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Taxonomy consistency on isolated PostgreSQL 17 and PostgREST
        run: npm run verify:taxonomy-consistency-postgres17

  dashboard-truth-postgres:
    name: Dashboard Truth · PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: venesia_dashboard_truth_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_dashboard_truth_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DASHBOARD_TRUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_dashboard_truth_ci
      DASHBOARD_TRUTH_DATABASE_REQUIRED: "1"
      DASHBOARD_TRUTH_DATABASE_DISPOSABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Dashboard Truth on isolated PostgreSQL 17
        run: npm run verify:dashboard-truth-postgres

  reports-analytics-postgres:
    name: Reports Analytics · PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: venesia_reports_analytics_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d venesia_reports_analytics_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      REPORTS_ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/venesia_reports_analytics_ci
      REPORTS_ANALYTICS_DATABASE_REQUIRED: "1"
      REPORTS_ANALYTICS_DATABASE_DISPOSABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Reports and Analytics on isolated PostgreSQL 17
        run: npm run verify:reports-analytics-postgres
